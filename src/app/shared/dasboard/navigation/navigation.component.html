<div
    class="layout"
    [class.collapsed]="menuCollapsed">

    <!-- ===========================
         SIDEBAR
    ============================ -->

    <aside class="sidebar">

        @if (!menuCollapsed) {

            <div class="sidebar-header">

                <span class="menu-title">

               

                </span>

            </div>

            <hr>

        }

        <app-vertical-menu
            [collapsed]="menuCollapsed">
        </app-vertical-menu>

    </aside>

    @if (isHandset && !menuCollapsed) {
        <button
            class="sidebar-backdrop"
            type="button"
            aria-label="Cerrar menú"
            (click)="toggleMenu()">
        </button>
    }

    <!-- ===========================
         CONTENIDO
    ============================ -->

    <main class="content">

        <mat-toolbar color="primary">

            <button
                mat-icon-button
                class="menu-toggle"
                type="button"
                [attr.aria-label]="menuCollapsed ? 'Abrir menú' : 'Cerrar menú'"
                [attr.aria-expanded]="!menuCollapsed"
                (click)="toggleMenu()">

                <mat-icon>menu</mat-icon>

            </button>

            <div class="container__barra">

                <div class="barra__usuario">

                    @if (fotoUsuarioSrc) {
                        <img class="foto-usuario" [src]="fotoUsuarioSrc" alt="Foto de usuario">
                    } @else {
                        <mat-icon>account_circle</mat-icon>
                    }

                    <div>

                        <strong>{{ username || 'Usuario' }}</strong>

                        <span>{{ roleLabel }}</span>

                    </div>

                </div>

                <div class="barra__logout">

                    <button
                        mat-icon-button
                        type="button"
                        [attr.aria-label]="temaOscuro ? 'Activar tema claro' : 'Activar tema oscuro'"
                        [matTooltip]="temaOscuro ? 'Tema claro' : 'Tema oscuro'"
                        (click)="alternarTema()">
                        <mat-icon>{{ temaOscuro ? 'light_mode' : 'dark_mode' }}</mat-icon>
                    </button>

                    <button
                        mat-icon-button
                        type="button"
                        aria-label="Cerrar sesión"
                        (click)="logout()">

                        <app-icon
                            [iconSrc]="'assets/icons/power.png'"
                            [iconAlt]="'Salir'"
                            [size]="'30px'">
                        </app-icon>

                    </button>

                </div>

            </div>

        </mat-toolbar>

        <section class="router-content">

            <router-outlet></router-outlet>

        </section>

    </main>

</div>
