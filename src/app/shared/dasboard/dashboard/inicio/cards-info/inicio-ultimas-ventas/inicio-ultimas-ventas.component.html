<div class="ventas-list">
    <div class="empty" *ngIf="loading">Cargando ventas…</div>
    <div class="empty error" *ngIf="error">No pudimos cargar las ventas. Intentá nuevamente.</div>

    @for (venta of (!loading && !error ? ventas : []); track venta.numero) {

        <div class="venta-item">

            <div>

                <div class="numero">

                    {{venta.numero}}

                </div>

                <div class="cliente">

                    {{venta.cliente}}

                </div>

            </div>

            <div class="importe">

                {{venta.total | currency:'ARS'}}

            </div>

        </div>

    } @empty {

        <div class="empty">

            No hay ventas registradas todavía.

        </div>

    }

</div>
<div class="footer" *ngIf="!loading && !error && ventas.length">
  <a mat-button color="primary" routerLink="/dashboard/reportes/ventas/resumen">Ver todas</a>
</div>
