<div class="stock-container">

    <table class="stock-table">

        <thead>

            <tr>

                <th>Producto</th>

                <th class="text-center">Stock</th>

            </tr>

        </thead>

        <tbody>

            @for(product of productos; track product.id){

                <tr>

                    <td>

                        {{product.name}}

                    </td>

                    <td class="text-center">

                        <span
                            class="badge"
                            [ngClass]="{

                                'danger': product.stock <= 2,

                                'warning': product.stock > 2 && product.stock <= product.stockMin,

                                'success': product.stock > product.stockMin

                            }">

                            {{product.stock}}

                        </span>

                    </td>

                </tr>

            } @empty {

                <tr>

                    <td colspan="2" class="empty">

                        No existen productos con bajo stock

                    </td>

                </tr>

            }

        </tbody>

    </table>

    <div class="footer">

        <button mat-button color="primary">

            Ver todos

        </button>

    </div>

</div>
