<div>
    <mat-form-field class="example-full-width">
        <div *ngIf="enableFilter" Class="btn-busqueda"></div>
        <mat-label>Filtrar datos </mat-label>   
             <input matInput (input)="applyFilter($event)" placeholder="Filtrar..." />
    </mat-form-field>
 
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>{{ columnNames[column] || column | titlecase }}</th>
            <td mat-cell *matCellDef="let element">
                {{ columnConfig[column] && columnConfig[column].type === 'currency' ?
                (element[column] | currency:'ARS':'symbol-narrow') : element[column] }}
            </td>
        </ng-container>

        <!-- Columna de acciones -->
        <ng-container *ngIf="showActions" matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <button *ngIf="editComponent" mat-button color="primary" (click)="abonarFactura(editComponent,element.id)">
                    ✏️ Editar
                </button>
                <button *ngIf="deleteComponent" mat-button color="warn"
                    (click)="abonarFactura(deleteComponent, element)">
                    🗑️ Eliminar
                </button>
                <button *ngIf="verDetalleFacturaComponent" mat-button color="accent"
                    (click)="verFactura(verDetalleFacturaComponent,element.id)">
                    👁️ Ver
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns.concat(showActions ? ['actions'] : [])"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns.concat(showActions ? ['actions'] : []);"></tr>
    </table>
    <mat-paginator *ngIf="enablePagination" [pageSize]="5"></mat-paginator>
</div>

 @if(btnCerrar){
<button mat-button color="warn" (click)="onClose()">Cerrar</button>
}
