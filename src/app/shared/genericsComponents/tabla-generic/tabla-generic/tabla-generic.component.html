<div>

  <!-- =====================================================
       FILTRO
  ====================================================== -->

  <mat-form-field
    class="example-full-width"
    *ngIf="enableFilter">

    <mat-label>
      Filtrar datos
    </mat-label>

    <input
      matInput
      (input)="applyFilter($event)"
      placeholder="Filtrar..."
    />

  </mat-form-field>


  <!-- =====================================================
       TABLA
  ====================================================== -->

  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z8">


    <!-- ===================================================
         COLUMNAS
    ==================================================== -->

    <ng-container
      *ngFor="let column of displayedColumns"
      [matColumnDef]="column">


      <th
        mat-header-cell
        *matHeaderCellDef>

        {{
          columnNames[column]
            || (column | titlecase)
        }}

      </th>


      <td
        mat-cell
        *matCellDef="let element">

        <ng-container
          *ngIf="
            columnConfig[column]?.type === 'currency';
            else normalValue
          ">

          {{
            element[column]
              | currency:'ARS':'symbol-narrow'
          }}

        </ng-container>


        <ng-template #normalValue>

          {{
            element[column]
          }}

        </ng-template>

      </td>

    </ng-container>


    <!-- ===================================================
         ACCIONES
    ==================================================== -->

    <ng-container
      *ngIf="showActions"
      matColumnDef="actions">


      <th
        mat-header-cell
        *matHeaderCellDef>

        Acciones

      </th>


      <td
        mat-cell
        *matCellDef="let element">


        <!-- EDITAR -->

        <button
          *ngIf="editComponent"
          mat-button
          color="primary"
          type="button"
          (click)="abonarFactura(
            editComponent,
            element
          )">

          ✏️ Editar

        </button>


        <!-- ELIMINAR -->

        <button
          *ngIf="deleteComponent"
          mat-button
          color="warn"
          type="button"
          (click)="abonarFactura(
            deleteComponent,
            element
          )">

          🗑️ Eliminar

        </button>


        <!-- VER DETALLE -->

        <button
          *ngIf="verDetalleFacturaComponent"
          mat-button
          color="accent"
          type="button"
          (click)="verFactura(
            verDetalleFacturaComponent,
            element
          )">

          👁️ Ver

        </button>


      </td>

    </ng-container>


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <tr
      mat-header-row
      *matHeaderRowDef="
        displayedColumns.concat(
          showActions
            ? ['actions']
            : []
        )
      ">
    </tr>


    <!-- ===================================================
         ROW
    ==================================================== -->

    <tr
      mat-row
      *matRowDef="
        let row;
        columns:
          displayedColumns.concat(
            showActions
              ? ['actions']
              : []
          )
      ">
    </tr>


    <!-- ===================================================
         SIN DATOS
    ==================================================== -->

    <tr
      class="mat-row"
      *ngIf="dataSource.data.length === 0">

      <td
        class="mat-cell"
        [attr.colspan]="
          displayedColumns.length +
          (showActions ? 1 : 0)
        ">

        No hay datos para mostrar.

      </td>

    </tr>


  </table>


  <!-- =====================================================
       PAGINADOR
  ====================================================== -->

  <mat-paginator
    *ngIf="enablePagination"
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons>
  </mat-paginator>


  <!-- =====================================================
       CERRAR
  ====================================================== -->

  <button
    *ngIf="btnCerrar"
    mat-button
    color="warn"
    type="button"
    (click)="onClose()">

    Cerrar

  </button>

</div>
