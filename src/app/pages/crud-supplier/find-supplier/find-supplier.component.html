<mat-form-field class="custom-form-field">
    <mat-label>Proveedor</mat-label>
    <mat-select [(value)]="selectedSupplier" (selectionChange)="onSupplierChange()">
      <mat-option *ngFor="let supplier of suppliers" [value]="supplier">
        {{ supplier.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
