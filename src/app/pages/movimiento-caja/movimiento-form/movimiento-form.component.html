<div class="movimiento-form-container">
  <!--==========================
      HEADER
  ===========================-->
  <div class="header-form">
    <div class="header-icon"> <mat-icon>swap_horiz</mat-icon> </div>
    <div><span>CAJA</span><h2>Registrar movimiento</h2><p>Ingresá el movimiento y su medio de pago.</p></div>
  </div>

  <!--==========================
      FORMULARIO
  ===========================-->

  <form class="modern-form" [formGroup]="movimientoForm" (ngSubmit)="guardar()">
    <section class="form-section"><div class="section-title"><mat-icon>tune</mat-icon><div><strong>Clasificación</strong><span>Definí qué operación se registrará.</span></div></div><div class="form-grid">
    <!--==========================
        TIPO
    ===========================-->

    <div class="form-group">
      <label>Tipo de movimiento</label>

      <select formControlName="tipo" (change)="onTipoChange()">
        <option value="">Seleccionar</option>

        <option *ngFor="let tipo of tipoMovimientoOptions" [value]="tipo">
          {{ tipo }}
        </option>
      </select>
    </div>

    <!--==========================
        CATEGORIA
    ===========================-->

    <div class="form-group fade" *ngIf="categoriaOptions.length">
      <label>Categoría</label>

      <select
        formControlName="categoriaMovimiento"
        (change)="onCategoriaChange()"
      >
        <option value="">Seleccionar</option>

        <option *ngFor="let categoria of categoriaOptions" [value]="categoria">
          {{ categoria }}
        </option>
      </select>
    </div></div></section>

    <!--==========================
        MONTO
    ===========================-->

    <section class="form-section fade" *ngIf="movimientoForm.get('categoriaMovimiento')?.value"><div class="section-title"><mat-icon>payments</mat-icon><div><strong>Importe y pago</strong><span>Indicá el monto y cómo ingresa o egresa.</span></div></div><div class="form-grid"><div class="form-group">
      <label>Monto</label>

      <div class="money-input">
        <span class="money-symbol">$</span>

        <input type="number" min="0.01" step="0.01" inputmode="decimal" data-money formControlName="monto" placeholder="0.00" />
      </div>
    </div>

    <!--==========================
        FORMA DE PAGO
    ===========================-->

    <div class="form-group">
      <label>Forma de pago</label>

      <select formControlName="medioPago">
        <option value="">Seleccionar</option>

        <option value="EFECTIVO">💵 Efectivo</option>
        <option value="TRANSFERENCIA">🏦 Transferencia</option>
        <option value="DEBITO">💳 Débito</option>
        <option value="CREDITO">💳 Crédito</option>
        <option value="MERCADO_PAGO">🟦 Mercado Pago</option>
        <option value="CHEQUE">📄 Cheque</option>
        <option value="CUENTA_CORRIENTE">📒 Cuenta Corriente</option>
        <option value="OTRO">📌 Otro</option>
      </select>
    </div></div></section>

    <!--==========================
        DETALLE GASTO
    ===========================-->

    <section class="form-section detalles" *ngIf="movimientoForm.get('categoriaMovimiento')?.value"><div class="section-title"><mat-icon>subject</mat-icon><div><strong>Información adicional</strong><span>Solo se muestran los datos que requiere la categoría.</span></div></div><div class="form-grid">
    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value === 'GASTO_MENOR'"
    >
      <label>📝 Detalle del gasto</label>

      <input
        type="text"
        formControlName="descripcion"
        placeholder="Ingrese el detalle del gasto"
      />
    </div>

    <!--==========================
        DETALLE INGRESO
    ===========================-->

    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('tipo')?.value === 'INGRESO'"
    >
      <label>📝 Detalle del ingreso</label>

      <input
        type="text"
        formControlName="descripcion"
        placeholder="Ingrese el detalle del ingreso"
      />
    </div>

    <!--==========================
        EMPLEADO
    ===========================-->

    <ng-container
      *ngIf="
        ['PAGO_SUELDO', 'ADELANTO'].includes(
          movimientoForm.get('categoriaMovimiento')?.value
        )
      "
    >
      <div class="form-group fade">
        <label>👤 Empleado</label>

        <select formControlName="empleadoId">
          <option value="">Seleccionar</option>

          <option *ngFor="let e of empleados" [value]="e.id">
            {{ e.nombre }} {{ e.apellido }}
          </option>
        </select>
      </div>

      <!--======================
            MES Y AÑO
      ======================-->

      <div
        class="double-grid"
        *ngIf="
          movimientoForm.get('categoriaMovimiento')?.value === 'PAGO_SUELDO'
        "
      >
        <div class="form-group">
          <label>📅 Mes</label>

          <input
            type="number"
            min="1"
            max="12"
            formControlName="mesCorrespondiente"
          />
        </div>

        <div class="form-group">
          <label>📆 Año</label>

          <input type="number" formControlName="anioCorrespondiente" />
        </div>
      </div>
    </ng-container>

    <!--==========================
        PROVEEDOR
    ===========================-->

    <ng-container
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value === 'PROVEEDOR'"
    >
      <div class="double-grid fade">
        <div class="form-group">
          <label>🏢 ID Proveedor</label>

          <input
            type="number"
            formControlName="proveedorId"
            placeholder="Ingrese el ID"
          />
        </div>

        <div class="form-group">
          <label>📄 Número de factura</label>

          <input
            type="text"
            formControlName="numeroFactura"
            placeholder="Ej: A0001-00001234"
          />
        </div>
      </div>
    </ng-container></div></section>

    <!--==========================
        BOTON
    ===========================-->

    <div class="footer-form">
      <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn-guardar"><mat-icon>save</mat-icon> Guardar movimiento</button>
    </div>
  </form>
</div>
