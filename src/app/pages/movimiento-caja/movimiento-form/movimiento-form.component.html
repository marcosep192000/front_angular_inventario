<div class="movimiento-form-container">
  <!--==========================
      HEADER
  ===========================-->
  <div class="header-form">
    <h2>💼 Registrar Movimiento de Caja</h2>
    <p>Complete la información del movimiento.</p>
  </div>

  <!--==========================
      FORMULARIO
  ===========================-->

  <form class="modern-form" [formGroup]="movimientoForm" (ngSubmit)="guardar()">
    <!--==========================
        TIPO
    ===========================-->

    <div class="form-group">
      <label>🧾 Tipo de movimiento</label>

      <select formControlName="tipo" (change)="onTipoChange()">
        <option value="">Seleccionar</option>

        <option *ngFor="let tipo of tipoMovimientoOptions" [value]="tipo">
          {{ tipo }}
        </option>
      </select>
    </div>

    <!--==========================
        CATEGORIA
    ===========================-->

    <div class="form-group fade" *ngIf="categoriaOptions.length">
      <label>📂 Categoría</label>

      <select
        formControlName="categoriaMovimiento"
        (change)="onCategoriaChange()"
      >
        <option value="">Seleccionar</option>

        <option *ngFor="let categoria of categoriaOptions" [value]="categoria">
          {{ categoria }}
        </option>
      </select>
    </div>

    <!--==========================
        MONTO
    ===========================-->

    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value"
    >
      <label>💲 Monto</label>

      <div class="money-input">
        <span class="money-symbol">$</span>

        <input type="number" formControlName="monto" placeholder="0.00" />
      </div>
    </div>

    <!--==========================
        FORMA DE PAGO
    ===========================-->

    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value"
    >
      <label>💳 Forma de pago</label>

      <select formControlName="medioPago">
        <option value="">Seleccionar</option>

        <option value="EFECTIVO">💵 Efectivo</option>
        <option value="TRANSFERENCIA">🏦 Transferencia</option>
        <option value="DEBITO">💳 Débito</option>
        <option value="CREDITO">💳 Crédito</option>
        <option value="MERCADO_PAGO">🟦 Mercado Pago</option>
        <option value="CHEQUE">📄 Cheque</option>
        <option value="CUENTA_CORRIENTE">📒 Cuenta Corriente</option>
        <option value="OTRO">📌 Otro</option>
      </select>
    </div>

    <!--==========================
        DETALLE GASTO
    ===========================-->

    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value === 'GASTO_MENOR'"
    >
      <label>📝 Detalle del gasto</label>

      <input
        type="text"
        formControlName="descripcion"
        placeholder="Ingrese el detalle del gasto"
      />
    </div>

    <!--==========================
        DETALLE INGRESO
    ===========================-->

    <div
      class="form-group fade"
      *ngIf="movimientoForm.get('tipo')?.value === 'INGRESO'"
    >
      <label>📝 Detalle del ingreso</label>

      <input
        type="text"
        formControlName="descripcion"
        placeholder="Ingrese el detalle del ingreso"
      />
    </div>

    <!--==========================
        EMPLEADO
    ===========================-->

    <ng-container
      *ngIf="
        ['PAGO_SUELDO', 'ADELANTO'].includes(
          movimientoForm.get('categoriaMovimiento')?.value
        )
      "
    >
      <div class="form-group fade">
        <label>👤 Empleado</label>

        <select formControlName="empleadoId">
          <option value="">Seleccionar</option>

          <option *ngFor="let e of empleados" [value]="e.id">
            {{ e.nombre }} {{ e.apellido }}
          </option>
        </select>
      </div>

      <!--======================
            MES Y AÑO
      ======================-->

      <div
        class="double-grid"
        *ngIf="
          movimientoForm.get('categoriaMovimiento')?.value === 'PAGO_SUELDO'
        "
      >
        <div class="form-group">
          <label>📅 Mes</label>

          <input
            type="number"
            min="1"
            max="12"
            formControlName="mesCorrespondiente"
          />
        </div>

        <div class="form-group">
          <label>📆 Año</label>

          <input type="number" formControlName="anioCorrespondiente" />
        </div>
      </div>
    </ng-container>

    <!--==========================
        PROVEEDOR
    ===========================-->

    <ng-container
      *ngIf="movimientoForm.get('categoriaMovimiento')?.value === 'PROVEEDOR'"
    >
      <div class="double-grid fade">
        <div class="form-group">
          <label>🏢 ID Proveedor</label>

          <input
            type="number"
            formControlName="proveedorId"
            placeholder="Ingrese el ID"
          />
        </div>

        <div class="form-group">
          <label>📄 Número de factura</label>

          <input
            type="text"
            formControlName="numeroFactura"
            placeholder="Ej: A0001-00001234"
          />
        </div>
      </div>
    </ng-container>

    <!--==========================
        BOTON
    ===========================-->

    <div class="footer-form">
      <button type="submit" class="btn-guardar">💾 Guardar Movimiento</button>
    </div>
  </form>
</div>
