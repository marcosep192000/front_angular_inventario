<div class="container">
    <div class="container__title">
        <app-icon [iconSrc]="'assets/icons/category_search.png'"  [size]="'50px'"></app-icon> 
        <h2 class="title__color" mat-dialog-title>{{ data.tipo === 'createCategory' ?
            'Crear Nueva Categoria' : 'Actualizar Categoria' }}</h2>
    </div>



    <form  *ngIf="formGroup" [formGroup]="formGroup">






    <mat-dialog-content>

<div class="container__text">
     <mat-form-field>
        <input matInput   formControlName="nameCategory"  placeholder="Nombre de la Categoria">
    </mat-form-field> 

<mat-form-field>
    <input matInput   formControlName="descriptionCategory" placeholder="Descripcion Detallada">
</mat-form-field> 
</div>

    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-raised-button  class="warn" (click)="cancel()">Cancelar</button>
     @if (data.tipo =='createCategory') {
       <button mat-raised-button  cdkFocusInitial color="primary" (click)="save()">Guardar</button>
     } 
     @else{
         <button mat-raised-button cdkFocusInitial color="primary" (click)="update()">modificar</button>
     }
    
    
    </mat-dialog-actions>

</form>



</div>
