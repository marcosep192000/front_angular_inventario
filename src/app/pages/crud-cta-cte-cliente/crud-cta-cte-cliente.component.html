<section class="container__title" [formGroup]="formGroup">
  <div>
    <h2 class="title__color" mat-dialog-title><mat-icon>account_balance_wallet</mat-icon> Crear cuenta corriente</h2>
    <p>Definí el límite de crédito disponible para este cliente.</p>
  </div>
  <mat-form-field class="input" appearance="outline">
    <mat-label>Límite de crédito</mat-label>
    <input matInput type="number" min="0" step="0.01" formControlName="montoMaximoDeCtaCte" placeholder="0,00">
    <span matTextPrefix>$&nbsp;</span>
    <mat-error *ngIf="formGroup.controls.montoMaximoDeCtaCte.hasError('required')">Ingresá un límite de crédito.</mat-error>
    <mat-error *ngIf="formGroup.controls.montoMaximoDeCtaCte.hasError('min')">El límite no puede ser negativo.</mat-error>
  </mat-form-field>
  <div mat-dialog-actions class="btn">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="button" [disabled]="guardando" (click)="guardar()">{{ guardando ? 'Guardando...' : 'Crear cuenta' }}</button>
  </div>
</section>
