<main class="registration-page">
  <mat-card class="registration-card">
    <mat-icon class="registration-icon">admin_panel_settings</mat-icon>
    <p class="eyebrow">INSTALACIÓN INICIAL</p>
    <h1>Crear administrador</h1>
    <p class="description">La licencia ya está activa. Creá el único administrador inicial para ingresar al ERP.</p>

    <form [formGroup]="form" (ngSubmit)="register()" autocomplete="off">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="username">
        <mat-error *ngIf="form.controls.email.hasError('required')">El email es obligatorio.</mat-error>
        <mat-error *ngIf="form.controls.email.hasError('email')">Ingresá un email válido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" autocomplete="new-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" aria-label="Mostrar u ocultar contraseña"><mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon></button>
        <mat-error>La contraseña es obligatoria.</mat-error>
      </mat-form-field>

      <p *ngIf="error" class="error" role="alert">{{ error }}</p>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">{{ submitting ? 'Creando…' : 'Crear administrador' }}</button>
      <button mat-stroked-button type="button" (click)="goToLogin()">Volver a iniciar sesión</button>
    </form>
  </mat-card>
</main>
