<section class="reportes"><header><div><p>CENTRO DE ANÁLISIS</p><h1>Reportes</h1><span>Consultá indicadores, evolución y datos clave de tu operación.</span></div><mat-icon>monitoring</mat-icon></header><div class="areas"><article *ngFor="let area of areas" class="area" [class]="area.color"><div class="area-head"><mat-icon>{{ area.icono }}</mat-icon><h2>{{ area.titulo }}</h2></div><a *ngFor="let item of area.items" [routerLink]="item.ruta" [class.proximamente]="!item.ruta"><span>{{ item.nombre }}</span><small *ngIf="!item.ruta">Próximamente</small><mat-icon *ngIf="item.ruta">arrow_forward</mat-icon></a></article></div></section>
